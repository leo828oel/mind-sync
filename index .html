<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a15"><title>MIND SYNC</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a15;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}.screen{display:none;min-height:100vh;padding:24px 18px 32px;max-width:520px;margin:auto}.screen.active{display:flex;flex-direction:column}h1{font-size:42px;letter-spacing:5px;margin:70px 0 8px;text-align:center}h2{margin:8px 0 18px}.sub{text-align:center;color:#8e96ad;margin:0 0 35px}.primary,.secondary,.level{border-radius:18px;padding:16px 18px;margin:7px 0;font-weight:800}.primary{background:#6c63ff}.secondary{background:#171b2d;border:1px solid #303750}.level{background:#12162a;border:1px solid #292f48;text-align:left;display:flex;justify-content:space-between;align-items:center}.level.locked{opacity:.42}.card{background:#101426;border:1px solid #2a3150;border-radius:24px;padding:22px;text-align:center;margin:10px 0 16px}.num{font-size:64px;font-weight:900;margin:8px}.status{color:#9ca6c0;font-size:14px}.avatars{display:flex;gap:10px}.ai{flex:1;background:#11172a;border-radius:16px;padding:14px;text-align:center}.face{font-size:30px}.ai small{display:block;color:#929ab1;margin-top:5px}.progress{height:8px;background:#1c2236;border-radius:8px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#6c63ff;width:0;transition:.3s}.emojis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.emoji{background:#151a2e;border:1px solid #2b3350;border-radius:16px;padding:15px;font-size:27px}.log{min-height:54px;color:#aab2c8;text-align:center;padding:10px}.result{text-align:center;margin:auto 0}.result .big{font-size:72px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.pill{background:#171c30;border-radius:999px;padding:8px 12px;font-size:13px;color:#aab2c8}.rules{background:#101426;border-radius:18px;padding:15px;color:#aeb6ca;line-height:1.7;font-size:14px}
</style></head><body>
<section id="home" class="screen active"><h1>MIND SYNC</h1><p class="sub">이모티콘으로 AI와 타이밍을 맞추는 카드 게임</p><button id="startBtn" class="primary">▶ 게임 시작</button><button id="tutorialBtn" class="secondary">📖 튜토리얼</button><div id="levels"></div></section>
<section id="game" class="screen"><div class="top"><button id="gameHome" class="secondary">← 홈</button><span id="levelPill" class="pill">LEVEL 1</span></div><h2 id="levelTitle">LEVEL 1</h2><div class="avatars"><div class="ai"><div class="face">🤖</div><b>신중형</b><small id="ai1"></small></div><div class="ai"><div class="face">👾</div><b>변칙형</b><small id="ai2"></small></div></div><div class="progress"><div id="bar" class="bar"></div></div><div class="card"><div class="status">내 카드</div><div id="cardNum" class="num">?</div><div id="cardHint" class="status"></div></div><div id="log" class="log">이모티콘으로 신호를 보내세요.</div><div class="emojis"><button class="emoji">👀</button><button class="emoji">🤫</button><button class="emoji">👍</button><button class="emoji">🔥</button><button class="emoji">😳</button><button class="emoji">🤔</button><button class="emoji">😎</button><button class="emoji">🚨</button></div><button id="finishBtn" class="primary">카드 제출</button></section>
<section id="result" class="screen"><div class="result"><div class="big">🎉</div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="nextBtn" class="primary">다음 레벨</button><button id="retryBtn" class="secondary">다시 하기</button><button id="resultHome" class="secondary">홈으로</button></div></section>
<script>
const L=[{m:10,n:3},{m:20,n:4},{m:30,n:5},{m:50,n:6},{m:100,n:7}];let unlocked=Math.max(1,Math.min(5,+localStorage.getItem("mindSyncUnlocked")||1)),level=1,cards=[],i=0,playing=false;
const $=x=>document.getElementById(x);function show(x){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(x).classList.add("active")}
function levels(){ $("levels").innerHTML='<div class="rules"><b>LEVEL 1~5</b><br>클리어하면 다음 레벨이 해금됩니다.</div>'+L.map((x,k)=>`<button class="level ${k+1>unlocked?"locked":""}" data-l="${k+1}"><span>LEVEL ${k+1}<br><small>1~${x.m} 카드 · ${x.n}장</small></span><b>${k+1<=unlocked?"▶":"🔒"}</b></button>`).join("");document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{let n=+b.dataset.l;if(n<=unlocked)start(n)})}
function start(n){level=n;let x=L[n-1];cards=[];while(cards.length<x.n){let v=1+Math.floor(Math.random()*x.m);if(!cards.includes(v))cards.push(v)}cards.sort((a,b)=>a-b);i=0;playing=true;$("levelPill").textContent="LEVEL "+n;$("levelTitle").textContent="LEVEL "+n;$("cardHint").textContent=`1~${x.m} 중 ${x.n}장의 카드를 순서대로 진행하세요.`;$("ai1").textContent="신호 대기";$("ai2").textContent="분석 중";$("log").textContent="이모티콘으로 신호를 보내세요.";show("game");card()}
function card(){if(i>=cards.length)return clear();$("cardNum").textContent=cards[i];$("bar").style.width=(i/cards.length*100)+"%";$("ai2").textContent=["👀 관찰 중","🤔 고민 중","👍 이해함","😳 긴장 중"][Math.floor(Math.random()*4)]}
function clear(){playing=false;unlocked=Math.max(unlocked,Math.min(5,level+1));localStorage.setItem("mindSyncUnlocked",unlocked);$("resultTitle").textContent="LEVEL "+level+" CLEAR!";$("resultText").textContent=level<5?"다음 레벨이 해금됐습니다!":"LEVEL 5까지 모두 클리어했습니다!";$("nextBtn").classList.toggle("hidden",level>=5);show("result");levels()}
document.querySelectorAll(".emoji").forEach(b=>b.onclick=()=>{if(playing){$("log").textContent="AI에게 "+b.textContent+" 신호를 보냈습니다.";$("ai1").textContent="신호 수신: "+b.textContent}});
$("startBtn").onclick=()=>start(unlocked);$("tutorialBtn").onclick=()=>alert("카드를 확인하고 이모티콘으로 AI에게 신호를 보내세요. 카드 제출을 누르면 다음 카드로 진행합니다. 레벨을 클리어하면 다음 레벨이 해금됩니다.");
$("finishBtn").onclick=()=>{if(playing){i++;$("log").textContent="다음 카드로 이동합니다.";card()}};$("gameHome").onclick=()=>{playing=false;show("home")};$("resultHome").onclick=()=>show("home");$("retryBtn").onclick=()=>start(level);$("nextBtn").onclick=()=>start(level+1);levels();
</script></body></html>
